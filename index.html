<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Andamia</title>
    <meta name="theme-color" content="#1a3e7a" />
    <meta name="description" content="Gestor de tareas, hábitos y enfoque." />
    <link rel="icon" type="image/png" href="/iconos/icono-64.png" />
    <link rel="apple-touch-icon" href="/iconos/icono-apple-180.png" />
    <script>
      // Tema guardado (ver src/logica/temas.ts), aplicado antes de pintar para que no parpadee.
      try {
        var g = JSON.parse(localStorage.getItem("andamia-tema-variables") || "null");
        var r = document.documentElement;
        if (g && g.vars) {
          for (var k in g.vars) r.style.setProperty(k, g.vars[k]);
          r.style.fontSize = g.escala + "%";
          r.classList.toggle("dark", !!g.oscuro);
          r.dataset.tema = g.id;
          document.querySelector('meta[name="theme-color"]').setAttribute("content", g.color);
        } else {
          r.classList.toggle("dark", localStorage.getItem("andamia-tema") === "oscuro");
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="raiz"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
