<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Andamia</title>
    <meta name="theme-color" content="#2f6fb0" />
    <meta name="description" content="Gestor de tareas, hábitos y enfoque." />
    <link rel="icon" type="image/svg+xml" href="/iconos/icono.svg" />
    <link rel="apple-touch-icon" href="/iconos/icono-apple-180.png" />
    <script>
      try {
        var t = localStorage.getItem("andamia-tema");
        var o = t === "oscuro" || (!t && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", o);
      } catch (e) {}
      try {
        // Tema de color (ver src/logica/paletas.ts); por defecto Océano.
        var colores = { oceano: "#2f6fb0", lavanda: "#7a52c7", coral: "#c4553f", rosa: "#c2457f", grafito: "#4a5058", verde: "#2f6b5e" };
        var p = localStorage.getItem("andamia-paleta");
        if (!colores[p]) p = "oceano";
        document.documentElement.dataset.paleta = p;
        document.querySelector('meta[name="theme-color"]').setAttribute("content", colores[p]);
      } catch (e) {
        document.documentElement.dataset.paleta = "oceano";
      }
    </script>
  </head>
  <body>
    <div id="raiz"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
