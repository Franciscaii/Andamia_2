# Crea el archivo .apk de Andamia para Android, gratis, en los servidores de GitHub.
# Se ejecuta a mano desde la pestaña Actions ("Run workflow") o al subir cambios a apps-nativas.
name: App de Android

on:
  workflow_dispatch:
    inputs:
      publicar:
        description: "Guardar el .apk en la rama apk-descargas (desmarcar para solo probar que compila)"
        type: boolean
        default: true
  push:
    branches: [apps-nativas]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Preparar la llave de firma
        id: llave
        env:
          LLAVE: ${{ secrets.ANDAMIA_LLAVE_BASE64 }}
        run: |
          if [ -z "$LLAVE" ]; then
            echo "::warning::Todavía no está el secreto ANDAMIA_LLAVE_BASE64 (ver docs/apps-nativas.md). No se crea el .apk."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "$LLAVE" | base64 -d > "$RUNNER_TEMP/andamia-android.jks"
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.llave.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        if: steps.llave.outputs.ok == 'true'
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        if: steps.llave.outputs.ok == 'true'
        run: npm ci

      - name: Compilar la web
        if: steps.llave.outputs.ok == 'true'
        # Usa .env.android (configuración pública de Firebase).
        run: npm run build -- --mode android

      - name: Copiar la web a Android
        if: steps.llave.outputs.ok == 'true'
        run: npx cap sync android

      - name: Crear el .apk
        if: steps.llave.outputs.ok == 'true'
        working-directory: android
        env:
          ANDAMIA_LLAVE_ARCHIVO: ${{ runner.temp }}/andamia-android.jks
          ANDAMIA_LLAVE_CLAVE: ${{ secrets.ANDAMIA_LLAVE_CLAVE }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/Andamia-Android.apk"

      - uses: actions/upload-artifact@v4
        if: steps.llave.outputs.ok == 'true'
        # Copia opcional: si el almacenamiento de artefactos de la cuenta está lleno, no debe impedir guardar el .apk en apk-descargas.
        continue-on-error: true
        with:
          name: Andamia-Android
          path: Andamia-Android.apk
          retention-days: 30

      - name: Guardar el .apk en la rama apk-descargas
        if: steps.llave.outputs.ok == 'true' && (github.event_name == 'push' || inputs.publicar)
        env:
          TOKEN: ${{ github.token }}
        run: |
          mkdir "$RUNNER_TEMP/descarga" && cd "$RUNNER_TEMP/descarga"
          git init -q -b apk-descargas
          cp "$GITHUB_WORKSPACE/Andamia-Android.apk" .
          git add Andamia-Android.apk
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -q -m "apk de ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" apk-descargas
